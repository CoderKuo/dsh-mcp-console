<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP 管理 · 重设计原型</title>
<style>
/* 布局：DSH 主区域里的一列（最宽 780px），顶部标题 + 三个标签；编辑用右侧抽屉 */
:root {
  --bg: #f6f6f7;
  --layer: #ffffff;
  --layer-sunk: #f1f1f3;
  --line: rgba(20, 20, 30, .10);
  --line-strong: rgba(20, 20, 30, .18);
  --fg: #1c1c22;
  --fg2: #4a4a55;
  --fg3: #8a8a96;
  --accent: #3964fe;
  --accent-soft: rgba(57, 100, 254, .10);
  --ok: #1f9d55;
  --ok-soft: rgba(31, 157, 85, .12);
  --warn: #c7771a;
  --warn-soft: rgba(199, 119, 26, .12);
  --bad: #e03131;
  --bad-soft: rgba(224, 49, 49, .10);
  --idle: #a0a0ab;
  --hover: rgba(20, 20, 30, .05);
  --shadow: 0 8px 30px rgba(20, 20, 40, .12);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17171b; --layer: #212127; --layer-sunk: #1b1b20; --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
  --fg: #ececf1; --fg2: #b4b4bf; --fg3: #7d7d89; --accent: #6b8cff; --accent-soft: rgba(107,140,255,.16);
  --ok: #3fbf74; --ok-soft: rgba(63,191,116,.14); --warn: #e3a04a; --warn-soft: rgba(227,160,74,.14);
  --bad: #ff6b6b; --bad-soft: rgba(255,107,107,.13); --idle: #6b6b76; --hover: rgba(255,255,255,.05); --shadow: 0 8px 30px rgba(0,0,0,.45);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #17171b; --layer: #212127; --layer-sunk: #1b1b20; --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
  --fg: #ececf1; --fg2: #b4b4bf; --fg3: #7d7d89; --accent: #6b8cff; --accent-soft: rgba(107,140,255,.16);
  --ok: #3fbf74; --ok-soft: rgba(63,191,116,.14); --warn: #e3a04a; --warn-soft: rgba(227,160,74,.14);
  --bad: #ff6b6b; --bad-soft: rgba(255,107,107,.13); --idle: #6b6b76; --hover: rgba(255,255,255,.05); --shadow: 0 8px 30px rgba(0,0,0,.45);
  color-scheme: dark }
:root[data-theme="light"] { color-scheme: light }

* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--fg); font: 14px/22px var(--sans); }
button, input, select, textarea { font: inherit; color: inherit }
.wrap { max-width: 780px; margin: 0 auto; padding-block: 28px 80px; padding-inline: 20px; display: flex; flex-direction: column; gap: 18px }

/* 原型说明条 */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; border: 1px dashed var(--line-strong); border-radius: var(--r-md); color: var(--fg3); font-size: 12px; line-height: 18px }
.proto b { color: var(--fg2); font-weight: 600 }
.proto .sp { flex: 1 }

/* 页头 */
.head { display: flex; align-items: center; gap: 12px }
.head h1 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 650; letter-spacing: -.01em }
.head .sub { color: var(--fg3); font-size: 12px }
.head .sp { flex: 1 }

/* 标签 */
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: var(--r-md); background: var(--layer-sunk); align-self: flex-start; border: 1px solid var(--line) }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--fg2); font-size: 13px; cursor: pointer }
.tab:hover { color: var(--fg) }
.tab[aria-selected="true"] { background: var(--layer); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08) }
.tab .n { min-width: 18px; padding: 0 5px; border-radius: 99px; background: var(--hover); color: var(--fg3); font-size: 11px; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums }
.tab .n.bad { background: var(--bad-soft); color: var(--bad) }

/* 按钮 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: transparent; font-size: 13px; white-space: nowrap; cursor: pointer }
.btn:hover:not(:disabled) { background: var(--hover) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn.primary { border-color: transparent; background: var(--accent); color: #fff }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent) }
.btn.ghost { border-color: transparent; color: var(--fg2) }
.btn.danger { border-color: transparent; color: var(--bad) }
.btn.lg { height: 34px; padding: 0 16px; border-radius: 10px }
.icon-btn { width: 30px; padding: 0; border-color: transparent; color: var(--fg3) }
.btn:focus-visible, .tab:focus-visible, .row-main:focus-visible, .src:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* 面板 */
.panel { background: var(--layer); border: 1px solid var(--line); border-radius: var(--r-lg) }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px }
.panel-head h2 { margin: 0; font-size: 14px; font-weight: 600 }
.panel-head .sp { flex: 1 }
.muted { color: var(--fg3); font-size: 12px; line-height: 18px }
.note { margin: 0; color: var(--fg3); font-size: 12px; line-height: 18px }

/* 状态 */
.dot { flex: none; width: 8px; height: 8px; border-radius: 50% }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft) }
.dot.bad { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft) }
.dot.wait { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); animation: pulse 1.4s ease-in-out infinite }
.dot.off { background: transparent; border: 1.5px solid var(--idle) }
@keyframes pulse { 50% { opacity: .35 } }
@media (prefers-reduced-motion: reduce) { .dot.wait { animation: none } }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: 5px; color: var(--fg2); font: 11px/18px var(--mono); white-space: nowrap }
.tag.soft { border-color: transparent; background: var(--hover) }
.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 99px; font-size: 11px; font-weight: 500; white-space: nowrap }
.chip.ok { background: var(--ok-soft); color: var(--ok) }
.chip.bad { background: var(--bad-soft); color: var(--bad) }
.chip.warn { background: var(--warn-soft); color: var(--warn) }
.chip.info { background: var(--accent-soft); color: var(--accent) }
.chip.idle { background: var(--hover); color: var(--fg3) }

/* 开关 */
.switch { position: relative; flex: none; width: 34px; height: 20px; border: 0; border-radius: 99px; background: var(--line-strong); cursor: pointer; transition: background .15s }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s }
.switch[aria-checked="true"] { background: var(--accent) }
.switch[aria-checked="true"]::after { transform: translateX(14px) }

/* 已安装：列表 */
.summary { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 0 16px 12px; color: var(--fg3); font-size: 12px }
.summary b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 3px }
.list { border-top: 1px solid var(--line) }
.row { border-bottom: 1px solid var(--line) }
.row:last-child { border-bottom: 0 }
.row-line { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px }
.row-main { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding: 2px 0; border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: 6px }
.row-name { font-weight: 600; white-space: nowrap }
.row-meta { overflow: hidden; color: var(--fg3); font-size: 12px; white-space: nowrap; text-overflow: ellipsis; min-width: 0 }
.row-meta.bad { color: var(--bad) }
.row-caret { flex: none; color: var(--fg3); transition: transform .15s }
.row[data-open="true"] .row-caret { transform: rotate(90deg) }
.row-detail { display: none; padding: 2px 16px 14px 34px }
.row[data-open="true"] .row-detail { display: grid; gap: 10px }
.kv { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 12px; line-height: 20px }
.kv dt { color: var(--fg3) }
.kv dd { margin: 0; min-width: 0; color: var(--fg2); word-break: break-all }
.kv .mono { font-family: var(--mono); font-size: 11.5px }
.err { margin: 0; padding: 8px 10px; border-radius: var(--r-sm); background: var(--bad-soft); color: var(--bad); font: 11.5px/18px var(--mono); white-space: pre-wrap; word-break: break-all }
.tools { display: flex; flex-wrap: wrap; gap: 4px }
.menu-wrap { position: relative }
.menu { position: absolute; right: 0; top: 34px; z-index: 5; min-width: 168px; padding: 4px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--layer); box-shadow: var(--shadow) }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; font-size: 13px; text-align: left; cursor: pointer }
.menu button:hover { background: var(--hover) }
.menu button.danger { color: var(--bad) }
.menu hr { margin: 4px 2px; border: 0; border-top: 1px solid var(--line) }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--bad-soft); font-size: 12px }
.empty { display: grid; justify-items: center; gap: 8px; padding: 36px 16px; text-align: center }

/* 添加：来源选择 */
.sources { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 16px 16px }
.src { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--layer); text-align: left; cursor: pointer }
.src:hover { border-color: var(--line-strong); background: var(--hover) }
.src[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.src svg { color: var(--accent) }
.src b { font-size: 13px }
.src span { color: var(--fg3); font-size: 12px; line-height: 17px }
.step { display: grid; gap: 14px; padding: 16px; border-top: 1px solid var(--line) }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--fg3); font-size: 12px }
.crumb button { padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px }

/* 表单 */
.field { display: grid; gap: 5px; min-width: 0 }
.label { color: var(--fg2); font-size: 12px; font-weight: 500 }
.input { width: 100%; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--layer-sunk); font-size: 13px; outline: none }
.input:focus { border-color: var(--accent); background: var(--layer) }
.input.mono { font-family: var(--mono); font-size: 12.5px }
textarea.input { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical }
.hint { color: var(--fg3); font-size: 12px; line-height: 18px }
.warn-line { display: flex; gap: 6px; color: var(--warn); font-size: 12px; line-height: 18px }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--layer-sunk); border: 1px solid var(--line); justify-self: start }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--fg2); font-size: 12.5px; cursor: pointer }
.seg button[aria-checked="true"] { background: var(--layer); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08) }
.pairs { display: grid; gap: 6px }
.pair { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) auto auto; align-items: center; gap: 6px }
.pair .input { height: 30px }
.check { display: inline-flex; align-items: center; gap: 5px; color: var(--fg2); font-size: 12px; white-space: nowrap; cursor: pointer }
.check input { margin: 0; accent-color: var(--accent) }
details.adv { border: 1px solid var(--line); border-radius: var(--r-md) }
details.adv > summary { display: flex; align-items: center; gap: 8px; padding: 9px 12px; color: var(--fg2); font-size: 12.5px; cursor: pointer; list-style: none }
details.adv > summary::-webkit-details-marker { display: none }
details.adv > summary::before { content: "›"; display: inline-block; color: var(--fg3); transition: transform .15s }
details.adv[open] > summary::before { transform: rotate(90deg) }
details.adv > div { display: grid; gap: 12px; padding: 4px 12px 12px }
.result { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-md); font-size: 13px }
.result.ok { background: var(--ok-soft) }
.result.bad { background: var(--bad-soft) }
.result .t { display: flex; align-items: center; gap: 8px; font-weight: 600 }
.result.ok .t { color: var(--ok) }
.result.bad .t { color: var(--bad) }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.actions .sp { flex: 1 }
.spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }

/* 搜索结果 */
.search { display: flex; gap: 8px }
.results { display: grid; gap: 8px }
.res { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md) }
.res-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px }
.res-top b { font-size: 13.5px }
.res-top a { color: var(--accent); font-size: 12px; text-decoration: none }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line) }
.opt code { overflow: hidden; color: var(--fg2); font: 12px/18px var(--mono); white-space: nowrap; text-overflow: ellipsis }
.opt .r { display: flex; align-items: center; gap: 6px }

/* 导入 */
.imp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md) }
.imp code { display: block; overflow: hidden; color: var(--fg3); font: 11.5px/18px var(--mono); white-space: nowrap; text-overflow: ellipsis }
.imp .title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px }

/* 发现 */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 16px 14px }
.stat { padding: 10px 12px; border-radius: var(--r-md); background: var(--layer-sunk) }
.stat b { display: block; font-size: 20px; line-height: 28px; font-variant-numeric: tabular-nums }
.stat span { color: var(--fg3); font-size: 12px }
.group { border-top: 1px solid var(--line) }
.group > summary { display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer; list-style: none; font-size: 13px }
.group > summary::-webkit-details-marker { display: none }
.group > summary::before { content: "›"; color: var(--fg3); transition: transform .15s }
.group[open] > summary::before { transform: rotate(90deg) }
.group ul { margin: 0; padding: 0 16px 12px 34px; columns: 2; column-gap: 24px; color: var(--fg2); font-size: 12px; line-height: 22px }
.runtimes { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 14px }

/* 抽屉 */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 10, 20, .32) }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; display: flex; flex-direction: column; width: min(520px, 100%); background: var(--layer); box-shadow: var(--shadow) }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line) }
.drawer-head h2 { margin: 0; font-size: 15px }
.drawer-body { flex: 1; overflow: auto; display: grid; align-content: start; gap: 14px; padding: 16px 18px }
.drawer-foot { padding: 12px 18px; border-top: 1px solid var(--line) }

/* 提示 */
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 30; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: var(--fg); color: var(--bg); font-size: 13px; box-shadow: var(--shadow) }

@media (max-width: 640px) {
  .sources, .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .group ul { columns: 1 }
  .row-meta { display: none }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="proto">
    <span><b>原型</b>：只看布局和交互，数据是假的，不连 DSH。</span>
    <span class="sp"></span>
    <button class="btn ghost" id="theme" type="button">切换深色 / 浅色</button>
    <button class="btn ghost" id="toggle-empty" type="button">看空状态</button>
  </div>

  <header class="head">
    <div>

      <div class="sub">当前 profile：desktop</div>

    <button class="tab" role="tab" data-tab="add" aria-selected="false">添加</button>
    <button class="tab" role="tab" data-tab="discover" aria-selected="false">发现</button>
  </nav>

  <main id="view"></main>
</div>
<div id="layer"></div>

    <div class="panel-head"><h2>让 AI 找出能接入的软件</h2></div>
    <div style="display:grid;gap:12px;padding:0 16px 16px">
      <p class="note">把上面的清单（不含文件路径和密钥）发给 AI，它联网查哪些软件有 MCP 服务器，列成表格后问你要接哪些。比如本机有 PostgreSQL、Obsidian、Figma，都有可用的 MCP。</p>
      <div class="actions"><select class="input" style="width:auto"><option>deepseek-v4-pro（默认）</option></select><button class="btn primary" data-act="ai-scan">交给 AI 分析</button></div>
    </div>
  </section>`
}

// ── 抽屉（编辑） ────────────────────────────────────────────────────────────
function openEdit(id) {
  const s = servers.find(x => x.id === id)
  state.menu = null
  state.test = null
  state.origin = null
  state.form = s.transport === 'http'
    ? { transport: 'http', name: s.name, url: s.url, headers: (s.headers ?? []).map(([n, v]) => ({ name: n, value: v === '读环境变量' ? 'Bearer ${GITHUB_TOKEN}' : '', fromEnv: v === '读环境变量' })), bridge: false }
    : { transport: 'stdio', name: s.name, commandLine: s.command, env: s.env.map(([n, v]) => ({ name: n, value: v === '读环境变量' ? n : 'C:\\IDA', fromEnv: v === '读环境变量' })) }
  state.editing = s
  render()
}
function drawerView() {
  if (!state.editing) return ''
  return `<div class="scrim" data-close-drawer></div>
    <aside class="drawer" role="dialog" aria-label="编辑 ${esc(state.editing.name)}">
      <div class="drawer-head"><h2>编辑 ${esc(state.editing.name)}</h2><span class="sp" style="flex:1"></span><button class="btn icon-btn" data-close-drawer aria-label="关闭">${ICON.x}</button></div>
      <div class="drawer-body">${formView('edit')}</div>
      <div class="drawer-foot"><span class="muted">保存时先测试，再重新安装配置包；失败会自动恢复原配置。</span></div>
    </aside>`
}

function exportLayer() {
  if (!state.exporting) return ''
  const json = JSON.stringify({ mcpServers: {
    'ida-pro-mcp': { command: 'C:\\Python312\\python.exe', args: ['C:\\ida-mcp\\server.py', '--port', '13337'], env: { IDA_HOME: 'C:\\IDA' } },
    context7: { command: 'npx', args: ['-y', '@upstash/context7-mcp@4.4.1'], env: { CONTEXT7_API_KEY: '${CONTEXT7_API_KEY}' } },
    github: { type: 'http', url: 'https://api.githubcopilot.com/mcp/', headers: { Authorization: 'Bearer ${GITHUB_TOKEN}' } },
  } }, null, 2)
  return `<div class="scrim" data-close-export></div>
    <aside class="drawer" role="dialog" aria-label="导出">
      <div class="drawer-head"><h2>导出 5 个服务器</h2><span class="sp" style="flex:1"></span><button class="btn icon-btn" data-close-export aria-label="关闭">${ICON.x}</button></div>
      <div class="drawer-body">
        <p class="note">标准 mcpServers 格式，Claude Desktop、Claude Code、Cursor、Windsurf 都能用。密钥不会导出，换成了 \${变量名}。</p>
        <textarea class="input mono" rows="16" readonly>${esc(json)}</textarea>
        <ul class="note" style="padding-left:18px;margin:0"><li>memory：在 DSH 里是禁用的</li><li>github：请求头 Authorization 需要在目标客户端里填写</li></ul>
      </div>
      <div class="drawer-foot actions"><button class="btn primary" data-act="copy">复制</button><button class="btn">下载 JSON</button></div>
    </aside>`
}

// ── 渲染与事件 ──────────────────────────────────────────────────────────────
function render() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)))
  const failed = servers.filter(s => s.status === 'failed').length
  const n = $('#count-installed'); n.textContent = state.empty ? '0' : String(servers.length); n.className = 'n' + (failed && !state.empty ? ' bad' : '')
  $('#view').innerHTML = state.tab === 'installed' ? installedView() : state.tab === 'add' ? addView() : discoverView()
  $('#layer').innerHTML = (state.editing ? drawerView() : '') + exportLayer()
}
function readForm(root) {
  const f = state.form
  if (!f) return
  const name = $('#f-name', root); if (name && !name.disabled) f.name = name.value
  const cmd = $('#f-cmd', root); if (cmd) f.commandLine = cmd.value
  const url = $('#f-url', root); if (url) f.url = url.value
  const bridge = $('#f-bridge', root); if (bridge) f.bridge = bridge.checked
  const list = f.transport === 'http' ? f.headers : f.env
  root.querySelectorAll('[data-pn]').forEach(input => { const p = list[Number(input.dataset.pn)]; if (p) p.name = input.value })
  root.querySelectorAll('[data-pv]').forEach(input => { const p = list[Number(input.dataset.pv)]; if (p) p.value = input.value })
  root.querySelectorAll('[data-pe]').forEach(input => { const p = list[Number(input.dataset.pe)]; if (p) p.fromEnv = input.checked })
}
function runTest(then) {
  readForm(document)
  state.testing = true; state.test = null; render()
  setTimeout(() => {
    const f = state.form
    state.testing = false
    if (f.transport === 'http' && /\/sse\/?$/.test(f.url) && !f.bridge) state.test = { ok: false, title: '服务器不接受 streamable-http 请求，可能只支持 SSE', detail: '服务器返回 405', bridge: true }
    else if (f.transport === 'http' && /sentry/.test(f.url) && !f.bridge) state.test = { ok: false, title: '这个服务需要 OAuth 登录，DSH 不能直连', detail: '服务器返回 401，并要求 OAuth 登录', bridge: true }
    else if (/^uvx\b/.test(f.commandLine ?? '') && f.transport === 'stdio') state.test = { ok: false, title: '找不到要运行的程序', detail: '"uvx" 不在 DSH 能看到的 PATH 里' }
    else state.test = { ok: true, server: (f.name || 'server') + ' 1.0', ms: 1400 + Math.round(Math.random() * 900), tools: f.name === 'github' ? ['get_me', 'search_repositories', 'get_file_contents', 'create_issue'] : ['resolve-library-id', 'query-docs'] }
    render()
    if (state.test.ok && then) then()
  }, 1300)
}
function saved() {
  const f = state.form
  if (state.editing) { toast(`已保存 ${state.editing.name}`); state.editing = null }
  else { toast(`已添加 ${f.name || '新服务器'}，回到「已安装」可以看到连接状态`); state.source = null; state.origin = null }
  state.form = null; state.test = null
  render()
}

document.addEventListener('click', e => {
  const el = e.target.closest('button, [data-row], label, input')
  if (!el) { if (state.menu) { state.menu = null; render() } return }
  const d = el.dataset
  if (el.classList.contains('tab')) { state.tab = d.tab; state.menu = null; render(); return }
  if (d.go) { state.tab = d.go; render(); return }
  if (d.goImport !== undefined) { e.preventDefault(); state.tab = 'add'; state.source = 'import'; state.form = null; render(); return }
  if (d.row) { state.open.has(d.row) ? state.open.delete(d.row) : state.open.add(d.row); state.menu = null; render(); return }
  if (d.switch) { const s = servers.find(x => x.id === d.switch); s.enabled = !s.enabled; s.status = s.enabled ? 'starting' : 'disabled'; render(); if (s.enabled) setTimeout(() => { s.status = 'connected'; render() }, 1500); return }
  if (d.menu) { e.stopPropagation(); state.menu = state.menu === d.menu ? null : d.menu; render(); return }
  if (d.edit) { openEdit(d.edit); return }
  if (d.askRemove) { state.confirm = d.askRemove; state.menu = null; state.open.add(d.askRemove); render(); return }
  if (d.cancelRemove !== undefined) { state.confirm = null; render(); return }
  if (d.remove) { const i = servers.findIndex(x => x.id === d.remove); toast(`已删除 ${servers[i].name}`); servers.splice(i, 1); state.confirm = null; render(); return }
  if (d.source) { state.source = state.source === d.source ? null : d.source; state.form = null; state.test = null; state.origin = null; render(); return }
  if (d.use) { const [ri, oi] = d.use.split(':').map(Number); const r = registry[ri]; state.form = JSON.parse(JSON.stringify({ env: [], headers: [], bridge: false, ...r.options[oi].form })); state.origin = r.title; state.test = null; render(); return }
  if (d.transport) { readForm(document); state.form.transport = d.transport; state.test = null; render(); return }
  if (d.delPair) { readForm(document); const list = state.form.transport === 'http' ? state.form.headers : state.form.env; list.splice(Number(d.delPair), 1); render(); return }
  if (d.closeDrawer !== undefined) { state.editing = null; state.form = null; state.test = null; render(); return }
  if (d.closeExport !== undefined) { state.exporting = false; render(); return }
  if (d.pick) { d.pick && (el.checked ? state.picked.add(d.pick) : state.picked.delete(d.pick)); render(); return }
  switch (d.act) {
    case 'export': state.exporting = true; render(); break
    case 'refresh': toast('已刷新'); break
    case 'copy': toast('已复制'); break
    case 'back': state.form = null; state.origin = null; state.test = null; render(); break
    case 'add-pair': readForm(document); (state.form.transport === 'http' ? state.form.headers : state.form.env).push({ name: '', value: '', fromEnv: false }); render(); break
    case 'test': runTest(); break
    case 'save': runTest(saved); break
    case 'force': saved(); break
    case 'use-bridge': readForm(document); state.form.bridge = true; state.test = null; render(); break
    case 'ai-start': toast('已在默认工作区打开会话（原型不会真的打开）'); break
    case 'ai-scan': toast('已打开会话，AI 正在联网分析（原型）'); break
    case 'import': toast(`已导入 ${state.picked.size} 个服务器`); state.picked.clear(); render(); break
    case 'rescan': toast('扫描完成'); break
    case 'test-row': state.menu = null; toast('正在重新连接…'); render(); break
    case 'repo': state.menu = null; toast('原型：这里会弹出一个输入框'); render(); break
  }
})
document.addEventListener('submit', e => {
  e.preventDefault()
  if (e.target.dataset.form === 'search') { state.query = $('#q').value; state.searched = true; render() }
})
document.addEventListener('input', e => {
  if (e.target.id === 'ai-src') {
    state.aiSource = e.target.value
    const pos = e.target.selectionStart
    render(); const input = $('#ai-src'); input.focus(); input.setSelectionRange(pos, pos)
  }
})
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (state.editing || state.exporting || state.menu)) { state.editing = null; state.exporting = false; state.menu = null; state.form = state.tab === 'add' ? state.form : null; render() } })
$('#add-top').addEventListener('click', () => { state.tab = 'add'; render() })
$('#theme').addEventListener('click', () => {
  const root = document.documentElement
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
  root.dataset.theme = dark ? 'light' : 'dark'
})
$('#toggle-empty').addEventListener('click', () => { state.empty = !state.empty; state.tab = 'installed'; $('#toggle-empty').textContent = state.empty ? '回到有数据' : '看空状态'; render() })
render()
</script>
</body>
</html>
